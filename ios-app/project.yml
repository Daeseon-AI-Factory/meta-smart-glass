name: SmartGlass

options:
  bundleIdPrefix: com.smartglass
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

targets:
  SmartGlass:
    type: application
    platform: iOS
    sources:
      - SmartGlass
    info:
      path: SmartGlass/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 개발용: 로컬 Bun 백엔드(http://localhost:3001)는 평문 HTTP라 ATS 예외 필요.
        # NSAllowsLocalNetworking이 loopback/localhost 평문 로드를 허용 (App Store 안전).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "Scan menus and signs in front of you to translate them to Korean."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartglass.app
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_ASSET_PATHS: '"SmartGlass/Preview Content"'
